<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObeyPunks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Courier New', monospace; }
    .pixel { image-rendering: pixelated; }
    
    .gallery-img {
      animation: float 5s ease-in-out infinite;
      transition: all 0.4s ease;
      width: 100%;
      height: auto;
    }
    
    .gallery-img:nth-child(2) { animation-delay: 0.3s; }
    .gallery-img:nth-child(3) { animation-delay: 1.0s; }
    .gallery-img:nth-child(4) { animation-delay: 0.6s; }
    .gallery-img:nth-child(5) { animation-delay: 1.7s; }
    .gallery-img:nth-child(6) { animation-delay: 0.4s; }
    .gallery-img:nth-child(7) { animation-delay: 1.3s; }
    .gallery-img:nth-child(8) { animation-delay: 1.9s; }
    .gallery-img:nth-child(9) { animation-delay: 0.8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .gallery-img:hover {
      transform: scale(1.1) rotate(3deg);
      filter: brightness(1.15) drop-shadow(0 0 30px rgb(74 222 128));
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Navbar -->
  <nav class="border-b border-zinc-800 bg-black sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center text-3xl border-2 border-white">👊</div>
        <h1 class="text-2xl font-bold tracking-widest">OBEYPUNKS</h1>
      </div>
      <div class="flex gap-8 text-sm font-medium">
        <a href="#gallery" class="hover:text-green-400">GALLERY</a>
        <a href="#details" class="hover:text-green-400">DETAILS</a>
      </div>
    </div>
  </nav>

  <!-- Gallery Section -->
  <section id="gallery" class="pt-16 pb-24 px-4">
    <div class="max-w-6xl mx-auto text-center">
      <p class="text-yellow-400 text-sm tracking-widest mb-3">COLLECTION LOOK</p>
      <h2 class="text-5xl md:text-6xl font-bold leading-none mb-8">
        CLASSIC PUNKS.<br>
        <span class="text-green-400">OBEY EDITION</span>
      </h2>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <img src="assets/078602110a1d25cfe9186dcfb63f5ff8.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/0c703681081531c984f3b1533ea2dca5.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/7869885b6f0f8459dd63eefb6044391a.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/8870c62fb01cb7289418fc658fda940.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/8b9e1e5ba70ecb120359b152d276af57.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/9e98edc52fba61456fabcf0ce7f8b339.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/cb4a743b5ac9751f7db9024a780ca524.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/d1d746bcaf29f01c10bda5fee1b9b38f.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
        <img src="assets/fdd5a596f5db5db919147ef3b5e7abf1.png" class="gallery-img pixel rounded-2xl border border-zinc-700" alt="">
      </div>
    </div>
  </section>

  <!-- Details -->
  <section id="details" class="py-20 bg-black border-t border-zinc-800">
    <div class="max-w-4xl mx-auto px-6">
      <p class="text-yellow-400 text-sm tracking-widest mb-3">COLLECTION SPECS</p>
      <h2 class="text-5xl font-bold mb-12">OBEYPUNKS DETAILS</h2>
      
      <div class="space-y-8">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <div class="flex gap-6">
            <div class="bg-green-500 text-black w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-2xl">01</div>
            <div>
              <h3 class="text-2xl font-bold">1:1 TO ORIGINALS</h3>
              <p class="text-zinc-400 mt-3">ObeyPunks maps one-for-one to the original CryptoPunks collection with Obey style.</p>
            </div>
          </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <div class="flex gap-6">
            <div class="bg-green-500 text-black w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-2xl">02</div>
            <div>
              <h3 class="text-2xl font-bold">FREE MINT</h3>
              <p class="text-zinc-400 mt-3">Free Mint for Whitelist only.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
